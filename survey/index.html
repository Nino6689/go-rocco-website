<!doctype html>
<html lang="en-GB">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#16203A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Site Survey">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Home Hub - Wireless Site Survey</title>
<style>
/* ============================================================
   Home Hub Smart Solutions - Wireless Site Survey
   Single-file field tool. Offline capable. No external requests.
   ============================================================ */
:root{
  --ink:#16203A;
  --ink-2:#233054;
  --ink-soft:#4A5875;
  --muted:#8493A9;
  --paper:#EEF1F4;
  --card:#FFFFFF;
  --field:#FCFDFE;
  --rule:#D6DDE4;
  --rule-soft:#E4EAEF;
  --accent:#2E6BFF;
  --accent-ink:#1B4FD1;
  --accent-dim:#E7EEFF;
  --s1:#0E8F5E;   /* strong  */
  --s2:#6E8F26;   /* adequate */
  --s3:#B87C0C;   /* marginal */
  --s4:#C0392F;   /* fail */
  --sev-hi:#C0392F;
  --sev-md:#B87C0C;
  --sev-lo:#3C6E9F;
  --ok:#0E8F5E;
  --shadow:0 1px 2px rgba(22,32,58,.05), 0 4px 14px rgba(22,32,58,.06);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:10px;
  --bar-h:64px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#E8EDF5;
    --ink-2:#0E1526;
    --ink-soft:#9FAEC6;
    --muted:#6C7C97;
    --paper:#0B111F;
    --card:#141C2E;
    --field:#101827;
    --rule:#27324A;
    --rule-soft:#1E2739;
    --accent:#5B8CFF;
    --accent-ink:#8FB0FF;
    --accent-dim:#1B2744;
    --s1:#2BB681;
    --s2:#9CBF45;
    --s3:#E0A33A;
    --s4:#E8695C;
    --sev-hi:#E8695C;
    --sev-md:#E0A33A;
    --sev-lo:#7FB0DE;
    --ok:#2BB681;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --ink:#E8EDF5; --ink-2:#0E1526; --ink-soft:#9FAEC6; --muted:#6C7C97;
  --paper:#0B111F; --card:#141C2E; --field:#101827; --rule:#27324A; --rule-soft:#1E2739;
  --accent:#5B8CFF; --accent-ink:#8FB0FF; --accent-dim:#1B2744;
  --s1:#2BB681; --s2:#9CBF45; --s3:#E0A33A; --s4:#E8695C;
  --sev-hi:#E8695C; --sev-md:#E0A33A; --sev-lo:#7FB0DE; --ok:#2BB681;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.45;
  padding-bottom:calc(var(--bar-h) + 28px + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.eyebrow{
  font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-soft);
}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:20;background:#16203A;color:#fff;
  padding:10px 16px 0;padding-top:calc(10px + env(safe-area-inset-top));
}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:700;letter-spacing:-.01em;font-size:15px;line-height:1.2}
.brand span{color:#8FB0FF;font-weight:500}
.hdr-tools{display:flex;gap:4px;align-items:center;flex:0 0 auto}
.icobtn{
  width:34px;height:34px;border-radius:8px;border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.06);color:#C8D6EE;font-size:15px;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
}
.icobtn:active{background:rgba(255,255,255,.16)}
.clientrow{display:flex;align-items:center;gap:8px;margin:5px 0 9px;min-width:0}
.client{
  flex:1;min-width:0;font-size:13px;color:#B6C4DC;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  background:none;border:0;padding:0;text-align:left;font-family:inherit;cursor:pointer;
}
.client b{color:#fff;font-weight:600}
.jobpill{
  flex:0 0 auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:#8FB0FF;border:1px solid rgba(143,176,255,.35);border-radius:20px;padding:3px 8px;
  background:none;cursor:pointer;
}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
nav::-webkit-scrollbar{display:none}
nav button{
  position:relative;flex:0 0 auto;background:none;border:0;color:#8494B5;font-family:var(--mono);
  font-size:11px;letter-spacing:.11em;text-transform:uppercase;padding:9px 11px 10px;
  border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;
}
nav button.on{color:#fff;border-bottom-color:#5B8CFF}
nav button .dot{
  display:inline-block;width:5px;height:5px;border-radius:50%;margin-left:5px;
  vertical-align:middle;background:#4E5E7E;
}
nav button .dot.part{background:#E0A33A}
nav button .dot.full{background:#2BB681}
.progwrap{height:3px;background:#2A3450}
.progbar{height:100%;background:#5B8CFF;width:0%;transition:width .3s ease}

/* ---------- layout ---------- */
main{padding:16px 14px 0;max-width:680px;margin:0 auto}
h2{font-size:20px;margin:2px 0 4px;letter-spacing:-.015em}
.lede{color:var(--ink-soft);font-size:13.5px;margin:0 0 14px}
.panel{
  background:var(--card);border:1px solid var(--rule);border-radius:var(--r);
  padding:14px;margin-bottom:12px;box-shadow:var(--shadow);
}
.panel > .eyebrow:first-child{display:block;margin-bottom:11px}

/* ---------- fields ---------- */
label.f{display:block;margin-bottom:15px}
label.f:last-child{margin-bottom:2px}
.lab{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;margin-bottom:6px}
.hint-btn{
  width:18px;height:18px;flex:0 0 auto;border-radius:50%;border:1px solid var(--rule);
  background:none;color:var(--ink-soft);font-size:10px;font-weight:700;line-height:1;
  cursor:pointer;padding:0;font-family:var(--mono);
}
.hint-btn[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.hint{
  display:none;font-size:12.5px;color:var(--ink-soft);background:var(--paper);
  border-left:2px solid var(--accent);padding:8px 10px;border-radius:0 6px 6px 0;margin-bottom:8px;
}
.hint.show{display:block}
input[type=text],input[type=number],input[type=date],input[type=tel],input[type=email],textarea,select{
  width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--rule);
  border-radius:8px;background:var(--field);color:var(--ink);appearance:none;
}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
textarea{min-height:66px;resize:vertical;line-height:1.4}
.num{font-family:var(--mono);letter-spacing:.02em}
.row{display:flex;gap:8px}
.row > *{flex:1;min-width:0}
.unit{position:relative}
.unit input{padding-right:52px}
.unit .u{
  position:absolute;right:11px;top:50%;transform:translateY(-50%);
  font-family:var(--mono);font-size:11px;color:var(--muted);pointer-events:none;
}

/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  font-size:13.5px;padding:9px 13px;border:1px solid var(--rule);border-radius:22px;
  background:var(--card);color:var(--ink-soft);cursor:pointer;font-family:inherit;line-height:1.2;
}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.chip.warn[aria-pressed="true"]{background:var(--s4);border-color:var(--s4)}

/* ---------- signal meter ---------- */
.rssi-in{display:flex;gap:6px;align-items:stretch}
.rssi-in input{flex:1;min-width:0;text-align:center;font-size:19px;font-weight:600;letter-spacing:.02em}
.step{
  flex:0 0 46px;border:1px solid var(--rule);background:var(--card);border-radius:8px;
  color:var(--ink);font-size:19px;font-weight:600;cursor:pointer;padding:0;font-family:var(--mono);
}
.step:active{background:var(--accent-dim)}
.meter{margin-top:9px}
.track{
  position:relative;height:10px;border-radius:5px;
  background:linear-gradient(90deg,var(--s1) 0%,var(--s1) 35%,var(--s2) 35%,var(--s2) 55%,var(--s3) 55%,var(--s3) 72%,var(--s4) 72%,var(--s4) 100%);
  opacity:.26;
}
.track.live{opacity:1}
.pin{
  position:absolute;top:-4px;width:3px;height:18px;background:var(--ink);border-radius:2px;
  transform:translateX(-50%);transition:left .18s ease;display:none;
  box-shadow:0 0 0 2px var(--card);
}
.pin.show{display:block}
.scalelabs{display:flex;justify-content:space-between;margin-top:4px}
.scalelabs span{font-family:var(--mono);font-size:9.5px;color:var(--muted)}
.verdict{
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:700;margin-top:7px;min-height:16px;display:flex;gap:8px;align-items:center;
}
.verdict .stamp{color:var(--muted);font-weight:400;letter-spacing:.06em;text-transform:none}

/* ---------- item cards ---------- */
.item{
  border:1px solid var(--rule);border-left:4px solid var(--rule);border-radius:9px;
  background:var(--card);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow);
}
.item-head{
  display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer;width:100%;
  background:none;border:0;font-family:inherit;text-align:left;color:inherit;
}
.item-n{font-family:var(--mono);font-size:11px;color:var(--muted);flex:0 0 auto;min-width:24px}
.item-t{flex:1;min-width:0;font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-t em{font-style:normal;color:var(--muted);font-weight:400}
.item-v{font-family:var(--mono);font-size:12.5px;font-weight:700;flex:0 0 auto}
.caret{flex:0 0 auto;color:var(--muted);font-size:11px;transition:transform .2s}
.item.open .caret{transform:rotate(90deg)}
.item-body{display:none;padding:4px 12px 14px;border-top:1px solid var(--rule-soft)}
.item.open .item-body{display:block}
.item-sub{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}

button.add{
  width:100%;padding:13px;border:1px dashed var(--rule);background:var(--card);border-radius:9px;
  color:var(--accent);font:inherit;font-weight:600;font-size:14.5px;cursor:pointer;margin-bottom:10px;
}
button.add:active{background:var(--accent-dim)}
.addrow{display:flex;gap:8px}
.addrow button.add{margin-bottom:10px}
button.del{
  background:none;border:0;color:var(--s4);font:inherit;font-size:13px;padding:8px 0;cursor:pointer;
}
.mini{
  border:1px solid var(--rule);background:var(--card);color:var(--ink-soft);border-radius:7px;
  font:inherit;font-size:12.5px;padding:7px 11px;cursor:pointer;
}
.mini:active{background:var(--accent-dim)}
.minirow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}

/* ---------- tick rows ---------- */
.tickrow{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--rule-soft)}
.tickrow:last-child{border-bottom:0}
.tickbox{
  width:26px;height:26px;flex:0 0 auto;border:1.5px solid var(--rule);border-radius:7px;
  background:var(--field);cursor:pointer;color:#fff;font-size:14px;line-height:1;padding:0;
  display:flex;align-items:center;justify-content:center;
}
.tickbox[aria-pressed="true"]{background:var(--s1);border-color:var(--s1)}
.tickrow .tt{flex:1;min-width:0;font-size:14px}
.tickrow.done .tt{color:var(--muted);text-decoration:line-through}

/* ---------- photos ---------- */
.shotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px}
.shot{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--rule);background:var(--field);aspect-ratio:4/3}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .cap{
  position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.78));
  color:#fff;font-size:10px;padding:12px 5px 4px;line-height:1.25;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.shot .x{
  position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;
  background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:1;cursor:pointer;padding:0;
}
.camwrap{position:relative;overflow:hidden;display:inline-block;width:100%}
.camwrap input[type=file]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}

/* ---------- findings ---------- */
.find{
  border:1px solid var(--rule);border-left:4px solid var(--rule);border-radius:9px;background:var(--card);
  padding:12px 13px;margin-bottom:10px;box-shadow:var(--shadow);
}
.find.hi{border-left-color:var(--sev-hi)}
.find.md{border-left-color:var(--sev-md)}
.find.lo{border-left-color:var(--sev-lo)}
.find .sev{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;
}
.find.hi .sev{color:var(--sev-hi)} .find.md .sev{color:var(--sev-md)} .find.lo .sev{color:var(--sev-lo)}
.find h3{font-size:14.5px;margin:4px 0 5px;letter-spacing:-.01em}
.find p{margin:0 0 6px;font-size:13.5px;color:var(--ink-soft);line-height:1.45}
.find .act{
  font-size:13px;color:var(--ink);background:var(--paper);border-radius:7px;padding:8px 10px;margin:0;
}
.find .act b{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:2px}
.empty{color:var(--muted);font-size:13.5px;text-align:center;padding:22px 8px}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.stat{background:var(--paper);border-radius:8px;padding:10px;text-align:center}
.stat .n{font-family:var(--mono);font-size:20px;font-weight:700;line-height:1.1}
.stat .l{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-top:3px}
.bars{margin-top:12px}
.barline{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12.5px}
.barline .k{width:70px;flex:0 0 auto;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.barline .b{flex:1;height:8px;border-radius:4px;background:var(--rule-soft);overflow:hidden}
.barline .b i{display:block;height:100%;border-radius:4px}
.barline .v{width:26px;flex:0 0 auto;text-align:right;font-family:var(--mono);font-size:11px;font-weight:700}

/* ---------- report ---------- */
#out{
  width:100%;min-height:320px;font-family:var(--mono);font-size:11.5px;line-height:1.5;
  white-space:pre;overflow-x:auto;
}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.btnrow button{
  flex:1 1 140px;padding:12px;border-radius:8px;border:1px solid var(--rule);background:var(--card);
  color:var(--ink);font:inherit;font-weight:600;font-size:14px;cursor:pointer;
}
.btnrow button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btnrow button:active{opacity:.85}

/* ---------- bottom bar ---------- */
.barbtn{
  position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--rule);
  padding:9px 14px;padding-bottom:calc(9px + env(safe-area-inset-bottom));
  display:flex;gap:8px;justify-content:center;
}
@supports not (background:color-mix(in srgb,red 50%,transparent)){ .barbtn{background:var(--paper)} }
.barbtn button{
  flex:1;max-width:320px;padding:14px;border-radius:9px;border:0;background:var(--accent);color:#fff;
  font:inherit;font-weight:600;font-size:15px;cursor:pointer;
}
.barbtn button.ghost{background:var(--card);color:var(--ink);border:1px solid var(--rule);flex:0 0 auto;max-width:104px}
.saved{
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);text-align:center;padding:6px 0 14px;
}

/* ---------- sheet / dialog ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,13,25,.5);z-index:40;display:none}
.scrim.on{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);
  border-radius:16px 16px 0 0;padding:16px 16px 0;
  padding-bottom:calc(16px + env(safe-area-inset-bottom));
  max-height:82vh;overflow-y:auto;display:none;
  box-shadow:0 -8px 30px rgba(8,13,25,.28);
}
.sheet.on{display:block}
.sheet h3{margin:0 0 3px;font-size:17px;letter-spacing:-.01em}
.sheet .sub{color:var(--ink-soft);font-size:13px;margin:0 0 14px}
.joblist{margin-bottom:12px}
.jobrow{
  display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--rule);
  border-radius:9px;margin-bottom:7px;background:var(--field);
}
.jobrow.on{border-color:var(--accent);background:var(--accent-dim)}
.jobrow .jt{flex:1;min-width:0;background:none;border:0;font:inherit;text-align:left;color:inherit;cursor:pointer;padding:0}
.jobrow .jt b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jobrow .jt span{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.06em}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--bar-h) + 20px + env(safe-area-inset-bottom));z-index:50;
  background:var(--ink);color:var(--paper);border-radius:9px;padding:11px 14px;font-size:13.5px;
  display:flex;align-items:center;gap:12px;max-width:calc(100vw - 28px);
  box-shadow:0 6px 22px rgba(8,13,25,.3);opacity:0;pointer-events:none;transition:opacity .2s;
}
:root[data-theme="dark"] .toast, :root:not([data-theme="light"]) .toast{}
.toast.on{opacity:1;pointer-events:auto}
.toast button{background:none;border:0;color:#8FB0FF;font:inherit;font-weight:700;font-size:13.5px;cursor:pointer;padding:0;flex:0 0 auto}

/* ---------- printable report ---------- */
#print{display:none}
@media print{
  header,.barbtn,main,.saved,.toast,.scrim,.sheet{display:none!important}
  body{background:#fff;color:#000;padding:0;font-size:11pt}
  #print{display:block;padding:0;max-width:none}
  #print h1{font-size:19pt;margin:0 0 2pt;letter-spacing:-.02em}
  #print .ph{font-family:var(--mono);font-size:8pt;letter-spacing:.14em;text-transform:uppercase;color:#555}
  #print h2{font-size:12.5pt;margin:20pt 0 6pt;padding-bottom:3pt;border-bottom:1.5pt solid #16203A;letter-spacing:-.01em}
  #print h3{font-size:11pt;margin:11pt 0 3pt}
  #print table{width:100%;border-collapse:collapse;font-size:9.5pt;margin:5pt 0 9pt}
  #print th{text-align:left;font-family:var(--mono);font-size:7.5pt;letter-spacing:.1em;text-transform:uppercase;color:#555;border-bottom:.75pt solid #999;padding:4pt 5pt 3pt}
  #print td{border-bottom:.5pt solid #DDD;padding:4pt 5pt;vertical-align:top}
  #print td.n{font-family:var(--mono);white-space:nowrap}
  #print .kv{width:100%;border-collapse:collapse;font-size:10pt}
  #print .kv td:first-child{width:38%;color:#555}
  #print .fnd{border-left:3pt solid #999;padding:4pt 0 4pt 9pt;margin:0 0 9pt;page-break-inside:avoid}
  #print .fnd.hi{border-left-color:#C0392F} #print .fnd.md{border-left-color:#B87C0C} #print .fnd.lo{border-left-color:#3C6E9F}
  #print .fnd b.s{font-family:var(--mono);font-size:7.5pt;letter-spacing:.14em;text-transform:uppercase}

<script>
"use strict";
/* ============================================================
   1. Constants
   ============================================================ */
var VERSION = "3.0";
var LS_KEY  = "hh_survey_v3";
var TABS = [
  {id:"job",     label:"Job"},
  {id:"base",    label:"Baseline"},
  {id:"rf",      label:"RF"},
  {id:"aps",     label:"Access pts"},
  {id:"points",  label:"Survey pts"},
  {id:"devices", label:"Devices"},
  {id:"photos",  label:"Photos"},
  {id:"findings",label:"Findings"},
  {id:"report",  label:"Report"}
];
var PHOTO_LIST = [
  "Label on each access point",
  "Rear of the router - ports in use",
  "Fibre entry / ONT",
  "Each access point in position",
  "Consumer unit or comms cupboard",
  "Kitchen appliance positions",
  "Any awkward wall or riser",
  "Sketch of the flat layout"
];
var BANDS = [
  {min:-55, key:"strong",   label:"Strong",   cssv:"--s1", print:"s1"},
  {min:-67, key:"adequate", label:"Adequate", cssv:"--s2", print:"s2"},
  {min:-74, key:"marginal", label:"Marginal", cssv:"--s3", print:"s3"},
  {min:-999,key:"fail",     label:"Fail",     cssv:"--s4", print:"s4"}
];
var THRESHOLD_NOTE = "Thresholds applied: -55 dBm or better strong · -56 to -67 adequate · -68 to -74 marginal · -75 or worse fail";

/* ============================================================
   2. State
   ============================================================ */
var DB = null;        /* { v, activeJob, jobs:{ id: job } } */
var J  = null;        /* active job */
var tab = 0;
var saveTimer = null;
var undoStack = null;

function uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }
function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function pad(n){ return n<10 ? "0"+n : ""+n; }
function nowHM(){ var d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); }

function blankJob(name){
  return {
    id: uid(),
    createdAt: new Date().toISOString(),
    meta: {client:name||"", site:"", date:todayISO(), surveyor:"", ref:"", contact:""},
    brief:{}, env:{},
    aps:    [{id:uid(),location:""},{id:uid(),location:""},{id:uid(),location:""}],
    points: [{id:uid(),_open:true,position:"Head height",room:""}],
    devices:[{id:uid(),_open:true,name:"Smart plug"},{id:uid(),name:"Dishwasher"},{id:uid(),name:"Hob"}],
    ticks:{}, shots:[]
  };
}

function loadDB(){
  var raw = null;
  try { raw = localStorage.getItem(LS_KEY); } catch(e){}
  if(raw){
    try {
      var parsed = JSON.parse(raw);
      if(parsed && parsed.jobs && Object.keys(parsed.jobs).length){ DB = parsed; }
    } catch(e){}
  }
  if(!DB){
    var j = blankJob("Jill Lovett");
    j.meta.site = "Homestream House, Mill Bay Lane, Horsham RH12 1SS";
    j.meta.surveyor = "Nino Bondonno";
    DB = {v:VERSION, activeJob:j.id, jobs:{}};
    DB.jobs[j.id] = j;
  }
  if(!DB.jobs[DB.activeJob]) DB.activeJob = Object.keys(DB.jobs)[0];
  J = DB.jobs[DB.activeJob];
  /* migration guards */
  ["brief","env","ticks"].forEach(function(k){ if(!J[k]) J[k] = {}; });
  ["aps","points","devices","shots"].forEach(function(k){ if(!J[k]) J[k] = []; });
  J.aps.concat(J.points, J.devices).forEach(function(o){ if(!o.id) o.id = uid(); });
}

function saveNow(){
  J.updatedAt = new Date().toISOString();
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(DB));
    setSaved("Saved " + nowHM());
  } catch(e){
    setSaved("Storage full - export a backup");
  }
}
function save(){ clearTimeout(saveTimer); setSaved("Saving…"); saveTimer = setTimeout(saveNow, 500); }
function setSaved(t){ var el = document.getElementById("savedNote"); if(el) el.textContent = t; }
window.addEventListener("pagehide", function(){ clearTimeout(saveTimer); try{ saveNow(); }catch(e){} });
document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="hidden"){ clearTimeout(saveTimer); try{ saveNow(); }catch(e){} } });

/* ============================================================
   3. Photo store (IndexedDB - keeps images out of localStorage)
   ============================================================ */
var IDB = (function(){
  var dbp = null;
  function open(){
    if(dbp) return dbp;
    dbp = new Promise(function(res, rej){
      if(!window.indexedDB){ rej(new Error("no idb")); return; }
      var r = indexedDB.open("hh_survey_media", 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore("shots"); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror   = function(){ rej(r.error); };
    });
    return dbp;
  }
  function tx(mode){ return open().then(function(db){ return db.transaction("shots", mode).objectStore("shots"); }); }
  return {
    put: function(k,v){ return tx("readwrite").then(function(s){ return new Promise(function(res,rej){ var q=s.put(v,k); q.onsuccess=function(){res()}; q.onerror=function(){rej(q.error)}; }); }); },
    get: function(k){ return tx("readonly").then(function(s){ return new Promise(function(res,rej){ var q=s.get(k); q.onsuccess=function(){res(q.result)}; q.onerror=function(){rej(q.error)}; }); }); },
    del: function(k){ return tx("readwrite").then(function(s){ return new Promise(function(res,rej){ var q=s.delete(k); q.onsuccess=function(){res()}; q.onerror=function(){rej(q.error)}; }); }); }
  };
})();

/* Downscale a captured photo so a full survey stays a sane size. */
function shrinkImage(file, maxPx, quality){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      var w = img.naturalWidth, h = img.naturalHeight;
      var sc = Math.min(1, maxPx / Math.max(w,h));
      w = Math.round(w*sc); h = Math.round(h*sc);
      var c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      res({data: c.toDataURL("image/jpeg", quality), w:w, h:h});
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error("decode failed")); };
    img.src = url;
  });
}

/* ============================================================
   4. Signal helpers
   ============================================================ */
function toNum(v){
  if(v===null || v===undefined) return null;
  var s = String(v).trim();
  if(s==="" || s==="-") return null;
  var n = parseFloat(s.replace(/[^0-9.\-]/g,""));
  return isFinite(n) ? n : null;
}
/* People type "62" more often than "-62" on a phone keypad. */
function normRssi(v){
  var n = toNum(v);
  if(n===null) return "";
  if(n > 0) n = -n;
  n = Math.max(-100, Math.min(0, Math.round(n)));
  return String(n);
}
function band(v){
  var n = toNum(v);
  if(n===null) return null;
  for(var i=0;i<BANDS.length;i++){ if(n >= BANDS[i].min) return BANDS[i]; }
  return BANDS[BANDS.length-1];
}
function bandColor(b){ return b ? "var("+b.cssv+")" : "var(--rule)"; }
function pinPct(v){ var n = Math.max(-90, Math.min(-30, toNum(v))); return ((-30-n)/60)*100; }
function dbm(v){ var n = toNum(v); return n===null ? "" : n+" dBm"; }

/* ============================================================
   5. DOM helpers
   ============================================================ */
function h(tag, attrs){
  var e = document.createElement(tag), k;
  attrs = attrs || {};
  for(k in attrs){
    if(attrs[k]===null || attrs[k]===undefined || attrs[k]===false) continue;
    if(k==="class") e.className = attrs[k];
    else if(k==="html") e.innerHTML = attrs[k];
    else if(k.slice(0,2)==="on") e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  for(var i=2;i<arguments.length;i++) app(e, arguments[i]);
  return e;
}
function app(e, kid){
  if(kid===null || kid===undefined || kid===false || kid==="") return;
  if(Array.isArray(kid)){ kid.forEach(function(k){ app(e,k); }); return; }
  e.appendChild(kid.nodeType ? kid : document.createTextNode(String(kid)));
}
function $(id){ return document.getElementById(id); }
function buzz(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms||8); }catch(e){} }

var toastTimer = null;
function toast(msg, actionLabel, actionFn){
  var t = $("toast"), b = $("toastAct");
  $("toastMsg").textContent = msg;
  if(actionLabel){
    b.hidden = false; b.textContent = actionLabel;
    b.onclick = function(){ hideToast(); actionFn(); };
  } else { b.hidden = true; b.onclick = null; }
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, actionLabel ? 7000 : 2600);
}
function hideToast(){ $("toast").classList.remove("on"); clearTimeout(toastTimer); }

/* ============================================================
   6. Field builders  (edit in place - never re-render on input)
   ============================================================ */
function field(labelText, hintText, ctrl){
  var wrap = h("label",{class:"f"});
  var lab  = h("div",{class:"lab"}, labelText);
  if(hintText){
    var hi = h("div",{class:"hint"}, hintText);
    var hb = h("button",{class:"hint-btn", type:"button", "aria-expanded":"false", "aria-label":"Why this matters"},"i");
    hb.addEventListener("click", function(ev){
      ev.preventDefault();
      var open = hi.classList.toggle("show");
      hb.setAttribute("aria-expanded", open ? "true" : "false");
    });
    lab.appendChild(hb);
    wrap.appendChild(lab); wrap.appendChild(hi);
  } else {
    wrap.appendChild(lab);
  }
  wrap.appendChild(ctrl);
  return wrap;
}
function bindInput(el, obj, key, after){
  el.addEventListener("input", function(){
    obj[key] = el.value;
    save(); markDirty();
    if(after) after();
  });
  return el;
}
function txt(obj, key, ph, mono, type, after){
  var i = h("input",{type:type||"text", placeholder:ph||"", class:mono?"num":"", value:obj[key]||""});
  return bindInput(i, obj, key, after);
}
function numf(obj, key, ph, unit){
  var i = h("input",{type:"text", inputmode:"decimal", placeholder:ph||"", class:"num", value:obj[key]||""});
  bindInput(i, obj, key);
  if(!unit) return i;
  return h("div",{class:"unit"}, i, h("span",{class:"u"}, unit));
}
function area(obj, key, ph, after){
  var i = h("textarea",{placeholder:ph||""});
  i.value = obj[key] || "";
  return bindInput(i, obj, key, after);
}
function chips(obj, key, opts, multi, onChange){
  var box = h("div",{class:"chips", role: multi?"group":"radiogroup"});
  opts.forEach(function(o){
    var label = typeof o === "string" ? o : o.l;
    var warn  = typeof o === "object" && o.warn;
    var on = multi ? (obj[key]||[]).indexOf(label)>-1 : obj[key]===label;
    var c = h("button",{class:"chip"+(warn?" warn":""), type:"button", "aria-pressed": on?"true":"false"}, label);
    c.addEventListener("click", function(){
      if(multi){
        var arr = (obj[key]||[]).slice();
        var ix = arr.indexOf(label);
        if(ix>-1) arr.splice(ix,1); else arr.push(label);
        obj[key] = arr;
      } else {
        obj[key] = (obj[key]===label) ? "" : label;
      }
      /* update in place - keeps scroll position and keyboard focus */
      Array.prototype.forEach.call(box.children, function(el, ix2){
        var l2 = typeof opts[ix2]==="string" ? opts[ix2] : opts[ix2].l;
        var on2 = multi ? (obj[key]||[]).indexOf(l2)>-1 : obj[key]===l2;
        el.setAttribute("aria-pressed", on2?"true":"false");
      });
      buzz(); save(); markDirty();
      if(onChange) onChange();
    });
    box.appendChild(c);
  });
  return box;
}

/* dBm entry: steppers, auto-negate, live meter, auto timestamp */
function rssi(obj, key, ph, onChange){
  var stampKey = key + "_at";
  var i = h("input",{type:"text", inputmode:"numeric", placeholder:ph||"-62", class:"num",
                     "aria-label":"Signal in dBm", value: obj[key]===undefined ? "" : obj[key]});
  var minus = h("button",{class:"step", type:"button", "aria-label":"Weaker by 1 dB"},"−");
  var plus  = h("button",{class:"step", type:"button", "aria-label":"Stronger by 1 dB"},"+");
  var track = h("div",{class:"track"});
  var pin   = h("div",{class:"pin"});
  track.appendChild(pin);
  var verd  = h("div",{class:"verdict"});
  var vtext = h("span",{}); var vstamp = h("span",{class:"stamp"});
  verd.appendChild(vtext); verd.appendChild(vstamp);

  function paint(){
    var b = band(i.value);
    if(b){
      track.classList.add("live"); pin.classList.add("show");
      pin.style.left = pinPct(i.value) + "%";
      vtext.textContent = b.label; vtext.style.color = bandColor(b);
    } else {
      track.classList.remove("live"); pin.classList.remove("show");
      vtext.textContent = "";
    }
    vstamp.textContent = obj[stampKey] ? "read " + obj[stampKey] : "";
  }
  function commit(val, stamp){
    obj[key] = val;
    if(stamp && val!=="" && !obj[stampKey]) obj[stampKey] = nowHM();
    if(val==="") delete obj[stampKey];
    paint(); save(); markDirty();
    if(onChange) onChange();
  }
  i.addEventListener("input", function(){ commit(i.value, false); });
  i.addEventListener("blur",  function(){ i.value = normRssi(i.value); commit(i.value, true); });
  function nudge(d){
    var n = toNum(i.value);
    if(n===null) n = -60; else n = n + d;
    n = Math.max(-100, Math.min(-20, n));
    i.value = String(n); commit(i.value, true); buzz();
  }
  minus.addEventListener("click", function(){ nudge(-1); });
  plus .addEventListener("click", function(){ nudge(1); });

  paint();
  return h("div",{},
    h("div",{class:"rssi-in"}, minus, i, plus),
    h("div",{class:"meter"}, track,
      h("div",{class:"scalelabs"},
        h("span",{},"-30"),h("span",{},"-55"),h("span",{},"-67"),h("span",{},"-74"),h("span",{},"-90")),
      verd)
  );
}

var dirtyFlag = false;
function markDirty(){ dirtyFlag = true; updateProgress(); }

/* ============================================================
   7. Collapsible record card
   ============================================================ */
function card(opts){
  /* opts: {tag, obj, title(), sub(), value() -> {text,color}, body(refresh), remove()} */
  var item = h("div",{class:"item" + (opts.obj._open ? " open" : "")});
  var nEl  = h("div",{class:"item-n"}, opts.tag);
  var tEl  = h("div",{class:"item-t"});
  var vEl  = h("div",{class:"item-v"});
  var head = h("button",{class:"item-head", type:"button", "aria-expanded": opts.obj._open?"true":"false"},
                nEl, tEl, vEl, h("div",{class:"caret"},"▶"));
  function refresh(){
    var t = opts.title();
    tEl.textContent = "";
    if(t) tEl.appendChild(document.createTextNode(t));
    else   tEl.appendChild(h("em",{}, opts.placeholder||"Not set"));
    var v = opts.value ? opts.value() : null;
    vEl.textContent = v && v.text ? v.text : "";
    vEl.style.color = v && v.color ? v.color : "";
    item.style.borderLeftColor = v && v.color ? v.color : "var(--rule)";
  }
  head.addEventListener("click", function(){
    var open = item.classList.toggle("open");
    opts.obj._open = open;
    head.setAttribute("aria-expanded", open ? "true":"false");
    save();
  });
  var body = h("div",{class:"item-body"});
  app(body, opts.body(refresh));
  if(opts.remove){
    body.appendChild(h("button",{class:"del", type:"button", onclick:function(){ opts.remove(); }}, opts.removeLabel||"Remove"));
  }
  refresh();
  item.appendChild(head); item.appendChild(body);
  return item;
}

/* Delete with undo rather than a confirm dialog - faster on site, safer too. */
function removeFrom(list, idx, what){
  var copy = list[idx];
  list.splice(idx,1);
  save(); render();
  toast(what + " removed", "Undo", function(){
    list.splice(Math.min(idx, list.length), 0, copy);
    save(); render();
  });
}

/* ============================================================
   8. Sections
   ============================================================ */

function secBase(){
  var e = J.env;
  var p = h("div",{});
  app(p, [ h("h2",{},"Network baseline"),
           h("p",{class:"lede"},"One scan from a central spot. This sets the ceiling that everything else is measured against.") ]);

/* ============================================================
   9. Analysis - the part that turns readings into a decision
   ============================================================ */
function stats(){
  var counts = {strong:0, adequate:0, marginal:0, fail:0};
  var measured = [];
  J.points.forEach(function(p){
    var v = (p.rssi24!=="" && p.rssi24!==undefined) ? p.rssi24 : p.rssi5;
    var b = band(v);
    if(b){ counts[b.key]++; measured.push({p:p, v:toNum(v), b:b}); }
  });
  measured.sort(function(a,b){ return a.v - b.v; });
  var e = J.env;
  var mainD = toNum(e.spdMainDown), worstD = toNum(e.spdWorstDown), lineD = toNum(e.lineDown);
  var drop = (mainD && worstD!==null) ? Math.round((1 - worstD/mainD)*100) : null;
  var lineDrop = (lineD && worstD!==null) ? Math.round((1 - worstD/lineD)*100) : null;
  return {
    counts: counts,
    measured: measured,
    total: measured.length,
    worst: measured[0] || null,
    aps: J.aps.filter(function(a){ return a.location || a.model; }).length,
    drop: drop,
    lineDrop: lineDrop
  };
}

function analyse(){
  var f = [], e = J.env, b = J.brief, st = stats();
  function add(sev, title, detail, action){ f.push({sev:sev, title:title, detail:detail, action:action}); }

  /* --- coverage --- */
  if(st.total){
    var bad = st.measured.filter(function(m){ return m.b.key==="fail" || m.b.key==="marginal"; });
    if(bad.length){
      var rooms = bad.map(function(m){ return (m.p.room||"unnamed") + " " + m.v + " dBm"; }).join(", ");
      add(bad.filter(function(m){return m.b.key==="fail";}).length ? "hi" : "md",
        bad.length + " of " + st.total + " survey points fall below usable signal",
        "Marginal or failing at: " + rooms + ". Anything at -75 dBm or worse will associate and then drop under load, which is exactly the behaviour the client is describing.",
        "Coverage in these areas needs an access point closer to them, not a more powerful one. Radio power is symmetrical - a stronger disc does not help a smart plug shout back.");
    } else {
      add("lo", "Coverage is adequate at every point measured",
        st.total + " points recorded, weakest " + (st.worst ? st.worst.v + " dBm in " + (st.worst.p.room||"an unnamed position") : "n/a") + ".",
        "Coverage is not the fault. Look at congestion, backhaul and addressing before quoting new hardware.");
    }
  }

  /* --- backhaul --- */
  var wirelessLinks = J.aps.filter(function(a){
    return a.role === "Satellite" && toNum(a.parentRssi)!==null;
  });
  wirelessLinks.forEach(function(a){
    var v = toNum(a.parentRssi);
    if(v <= -75){
      add("hi", "Backhaul to " + (a.location||"a satellite unit") + " is failing at " + v + " dBm",
        "The link from this unit back to its parent is the bottleneck. Every device behind it inherits this hop, so no amount of signal in the room fixes it.",
        "Run a cable to this position, or move the unit until the link reads better than -65 dBm. Adding a further disc downstream makes it worse, not better.");
    } else if(v <= -65){
      add("md", "Backhaul to " + (a.location||"a satellite unit") + " is weak at " + v + " dBm",
        "A wireless hop at this level roughly halves throughput and gets unstable when the band is busy.",
        "Wire this unit if consent allows, or reposition it so the parent link sits above -65 dBm.");
    }
  });
  if(b.backhaulType === "Wireless" && J.aps.length >= 3){
    add("md", "Every unit is linked wirelessly",
      "Wireless backhaul shares the same airtime as the clients using it. With " + J.aps.length + " units on a congested band this compounds through each hop.",
      "Wiring even one unit - typically the far one - usually delivers more improvement than replacing the whole system.");
  }

  /* --- device penalty --- */
  J.devices.forEach(function(d){
    var at = toNum(d.rssi), head = toNum(d.rssiHead);
    if(at===null || head===null) return;
    var loss = head - at;
    if(loss >= 10){
      add(at <= -75 ? "hi" : "md",
        (d.name||"A device") + " loses " + loss + " dB to its own position",
        "Head height in the same room reads " + head + " dBm, but " + at + " dBm at the device itself" + (d.where ? " (" + d.where + ")" : "") + ". The room has signal; the device does not.",
        "This is a positioning problem, not a coverage problem. Moving the nearest access point closer to floor level, or relocating the device, recovers the difference without new hardware.");
    } else if(at !== null && at <= -75){
      add("hi", (d.name||"A device") + " sits at " + at + " dBm",
        "Below the working threshold with no significant local obstruction penalty, so the room itself is short of signal.",
        "Needs an access point nearer this room.");
    }
  });

  /* --- channel / congestion --- */
  if(e.ch24 && e.ch24busy && e.ch24 === e.ch24busy && e.ch24 !== "Other"){
    add("md", "We are sitting on the busiest neighbouring channel (" + e.ch24 + ")",
      "Sharing a 2.4 GHz channel with the strongest neighbours means waiting for their airtime before every transmission.",
      "Move to whichever of 1, 6 or 11 is quietest and fix it there. Auto channel selection tends to re-pick badly.");
  }
  if(e.ch24overlap === "Yes"){
    add("md", "Neighbouring networks are on overlapping 2.4 GHz channels",
      "Anything outside 1, 6 and 11 partially overlaps three channels at once and cannot back off politely - it registers as noise rather than traffic.",
      "Nothing to be done about the neighbours, but it makes a strong case for wiring the backhaul rather than relying on 2.4 GHz.");
  }
  var strong24 = toNum(e.n24strong);
  if(strong24 !== null && strong24 >= 5){
    add("md", strong24 + " neighbouring networks stronger than -75 dBm on 2.4 GHz",
      "This is a congested band. Smart home devices are 2.4 GHz only, so they carry the full cost of it.",
      "Fix the channel manually, keep the width at 20 MHz, and get the access points closer to the devices so they transmit for less time.");
  }
  if(e.w24 === "40 MHz"){
    add("md", "2.4 GHz is running at 40 MHz wide",
      "A 40 MHz channel covers most of the band and collides with almost every neighbour.",
      "Set 2.4 GHz to 20 MHz. It costs headline speed that smart devices never use, and buys back reliability.");
  }

  /* --- addressing --- */
  if(e.dhcp === "Both - double NAT"){
    add("hi", "Double NAT - two devices are handing out addresses",
      "Devices pair successfully, then lose their route a day or two later. This matches the reported fault pattern exactly and costs nothing to test.",
      "Put the mesh into access point or bridge mode so the router alone does DHCP, then re-check a device that has been dropping.");
  }
  if(e.splitSsid === "Split into two names"){
    add("md", "2.4 GHz and 5 GHz are on separate network names",
      "Phones join the 5 GHz name, and smart plugs that only speak 2.4 GHz then fail to pair from that phone.",
      "Either merge the names with band steering, or note the 2.4 GHz name in the handover pack so re-onboarding does not stall.");
  }
  if(e.dfs === "Yes"){
    add("lo", "DFS channels in use nearby",
      "A radar detection forces everything off the channel for up to 30 minutes. It shows as an occasional total dropout with no obvious cause.",
      "If the 5 GHz drops are occasional and complete, pin the network to a non-DFS channel and watch for a week.");
  }

  /* --- throughput --- */
  if(st.drop !== null && st.drop >= 60){
    add(st.drop >= 80 ? "hi" : "md",
      "Throughput falls " + st.drop + "% between the router and " + (e.spdWorstWhere || "the worst position"),
      "Beside the router: " + e.spdMainDown + " Mbps. At the far point: " + e.spdWorstDown + " Mbps.",
      "A drop of this size on a mesh almost always traces to the backhaul hop rather than the client radio.");
  }
  if(st.lineDrop !== null && toNum(e.lineDown) && toNum(e.spdMainDown) && (toNum(e.spdMainDown) / toNum(e.lineDown)) < 0.6){
    add("md", "Even beside the router the line is under-delivering",
      "Paid-for line is " + e.lineDown + " Mbps, measured " + e.spdMainDown + " Mbps at the router.",
      "Worth a wired test before blaming the wireless. If the wired figure is also short, this is a line fault for the provider.");
  }

  /* --- history and constraints --- */
  if(b.preMerge === "No, started after"){
    add("md", "The fault started after the two flats were merged",
      "The property doubled in footprint without the network changing. A system sized for one flat is now covering two.",
      "Frame the quote around the new footprint rather than a fault in the existing kit - it is a capacity change, not a failure.");
  }
  if(b.cableConsent === "No"){
    add("md", "No permission to run cable",
      "Wired backhaul is off the table, so the design has to work within wireless hops.",
      "Consider a powerline or MoCA link over the existing coax as a middle option, and set expectations accordingly.");
  }
  if(b.smartApps === "None" || b.smartApps === "To be found"){
    add("md", "Smart home app logins are not confirmed",
      "If the network name changes, every device has to be re-added by hand. Without the logins that work cannot start.",
      "Get these before the install date. This is the single biggest risk to the second visit running over.");
  }
  if(b.adminPw === "No"){
    add("md", "No router admin password",
      "Cannot change channels, widths or DHCP mode without it - which rules out most of the free fixes above.",
      "Retrieve it from the provider, or plan for a router replacement in the quote.");
  }

  /* --- data gaps --- */
  var gaps = [];
  if(!st.total) gaps.push("no survey points recorded");
  if(st.total && st.total < 5) gaps.push("only " + st.total + " survey points");
  if(!J.devices.filter(function(d){ return toNum(d.rssi)!==null; }).length) gaps.push("no readings taken at a failing device");
  if(toNum(e.n24)===null) gaps.push("2.4 GHz neighbour count not recorded");
  if(!J.aps.filter(function(a){ return a.location; }).length) gaps.push("access point locations not recorded");
  if(gaps.length){
    add("lo","Survey is incomplete", "Still missing: " + gaps.join(", ") + ".",
      "Fill these before writing the quote - the recommendations above are only as good as the readings behind them.");
  }

  var order = {hi:0, md:1, lo:2};
  f.sort(function(a,b2){ return order[a.sev] - order[b2.sev]; });
  return {findings:f, st:st};
}

var SEVLABEL = {hi:"Priority", md:"Worth fixing", lo:"For the record"};

function secFindings(){
  var res = analyse(), st = res.st;
  var p = h("div",{});
  app(p, [ h("h2",{},"Findings"),

      h("div",{class:"stat"}, h("div",{class:"n"}, String(st.aps)), h("div",{class:"l"},"Units")),
      h("div",{class:"stat"}, h("div",{class:"n", style:"color:var(--s4)"}, String(st.counts.fail)), h("div",{class:"l"},"Failing")),
      h("div",{class:"stat"}, h("div",{class:"n"}, st.worst ? String(st.worst.v) : "–"), h("div",{class:"l"},"Worst dBm")),
      h("div",{class:"stat"}, h("div",{class:"n"}, st.drop===null ? "–" : st.drop+"%"), h("div",{class:"l"},"Speed drop"))
      ,h("div",{class:"stat"}, h("div",{class:"n"}, String(J.devices.filter(function(d){ return toNum(d.rssi)!==null; }).length)), h("div",{class:"l"},"Devices"))
    )]);
  if(st.total){
    var bars = h("div",{class:"bars"});
    BANDS.forEach(function(bd){
      var n = st.counts[bd.key], pct = Math.round(n/st.total*100);

        h("div",{class:"k"}, bd.label),
        h("div",{class:"b"}, h("i",{style:"width:"+pct+"%;background:var("+bd.cssv+")"})),
        h("div",{class:"v", style:"color:var("+bd.cssv+")"}, String(n)));
      bars.appendChild(line);
    });
    sp.appendChild(bars);
  }
  p.appendChild(sp);

  if(!res.findings.length){
    p.appendChild(h("div",{class:"panel"}, h("div",{class:"empty"},"Nothing to report yet. Record some readings and this fills itself in.")));
    return p;
  }
  res.findings.forEach(function(x){
    p.appendChild(h("div",{class:"find "+x.sev},
      h("div",{class:"sev"}, SEVLABEL[x.sev]),
      h("h3",{}, x.title),
      h("p",{}, x.detail),
      x.action ? h("p",{class:"act"}, h("b",{},"What to do"), x.action) : null));
  });
  return p;
}

function line(k,v){ return (v!==undefined && v!==null && String(v).trim()!=="") ? k + ": " + v + "\n" : ""; }
function pair(a,b,unit){
  var x = (a===undefined||a==="") ? "?" : a, y = (b===undefined||b==="") ? "?" : b;
  return (x==="?" && y==="?") ? "" : x + " / " + y + (unit ? " " + unit : "");
}
function joinList(a){ return (a && a.length) ? a.join(", ") : ""; }

function buildText(){

  o += line("Subnet", e.subnet) + line("Gateway", e.gateway) + line("DHCP", e.dhcp);

  var taken = PHOTO_LIST.filter(function(x){ return J.ticks[x]; });
  o += "\n-- PHOTO RECORD --\n";

  o += taken.length ? taken.map(function(x){ return "  - " + x; }).join("\n") + "\n" : "(checklist not ticked)\n";
  if(e.freeNotes) o += "\n-- ADDITIONAL NOTES --\n" + e.freeNotes + "\n";
  if(e.verbalSummary) o += "\n-- TOLD THE CLIENT ON THE DAY --\n" + e.verbalSummary + "\n";
  o += "\n" + THRESHOLD_NOTE + "\n";
  return o;
}

function csvCell(v){
  var s = (v===undefined||v===null) ? "" : String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function buildCSV(){
  var rows = [["Ref","Room","Floor","Measured at","2.4 GHz dBm","2.4 band","5 GHz dBm","5 band","Serving AP","Channel","Link Mbps","Down","Up","Notes"]];
  J.points.forEach(function(p,i){
    rows.push(["P"+(i+1), p.room, p.floor, p.position, p.rssi24, band(p.rssi24)?band(p.rssi24).label:"",
               p.rssi5, band(p.rssi5)?band(p.rssi5).label:"", p.bssid, p.channel, p.rate, p.spdDown, p.spdUp, p.notes]);
  });
  J.devices.forEach(function(d,i){
    rows.push(["D"+(i+1), d.name, "", d.where||"At the device", d.rssi, band(d.rssi)?band(d.rssi).label:"",
               "", "", "", "", "", "", "", d.notes]);
  });
  return rows.map(function(r){ return r.map(csvCell).join(","); }).join("\n");
}

function download(name, text, mime){
  var blob = new Blob([text], {type: mime || "text/plain;charset=utf-8"});
  var url = URL.createObjectURL(blob);
  var a = h("a",{href:url, download:name});
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 400);
}
function slug(s){ return (s||"survey").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40) || "survey"; }
function fileBase(){ return "survey-" + slug(J.meta.client) + "-" + (J.meta.date || todayISO()); }

function esc(s){

    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function kvTable(pairs){
  var rows = pairs.filter(function(p){ return p[1]!==undefined && p[1]!==null && String(p[1]).trim()!==""; })
    .map(function(p){ return "<tr><td>"+esc(p[0])+"</td><td>"+esc(p[1]).replace(/\n/g,"<br>")+"</td></tr>"; }).join("");
  return rows ? "<table class='kv'>"+rows+"</table>" : "<p style='color:#777'>Not recorded.</p>";
}
function bandSpan(v){

    return IDB.get(s.id).then(function(d){ return {d:d, label:s.label, ts:s.ts}; }).catch(function(){ return null; });
  })).then(function(list){
    var got = list.filter(function(x){ return x && x.d; });

function secReport(){

  imp.addEventListener("change", function(){

      try {

        saveNow(); render();
        toast("Survey imported as a new job");
      } catch(err){ toast("That file could not be read"); }
    };
    r.readAsText(f);
  });
  app(bk, [ h("div",{class:"eyebrow"},"Backup"),
    h("p",{class:"lede", style:"margin-bottom:10px"},"The survey lives in this browser only. Export before clearing site data or changing phone."),
    h("div",{class:"btnrow"},
      h("button",{type:"button", onclick:function(){
        var one = {v:VERSION, activeJob:J.id, jobs:{}}; one.jobs[J.id] = J;
        download(fileBase()+".json", JSON.stringify(one, null, 2), "application/json");
      }},"Export this job"),
      h("button",{type:"button", onclick:function(){ imp.click(); }},"Import a job")),
    imp,
    h("div",{class:"eyebrow", style:"display:block;margin-top:10px"},
      "Recorded: " + J.points.length + " points · " + J.devices.length + " devices · " + J.aps.length + " access points · " + J.shots.length + " photos") ]);
  p.appendChild(bk);
  return p;
}

/* ============================================================
   11. Progress
   ============================================================ */
function filled(v){
  if(v===undefined || v===null) return false;
  if(Array.isArray(v)) return v.length>0;
  return String(v).trim() !== "";
}
function ratio(done, total){ return total ? Math.min(1, done/total) : 1; }

function progress(){
  var b = J.brief, e = J.env, per = {};
  function count(obj, keys){
    var d = 0; keys.forEach(function(k){ if(filled(obj[k])) d++; });
    return {d:d, t:keys.length};
  }
  var jobKeys  = ["apLocations","backhaulType","ontLocation","obstructions","cableConsent","faultList","recovery","preMerge","deviceCount","adminPw","smartApps","budget"];
  var baseKeys = ["ssid","subnet","gateway","dhcp","scanCount","spdMainDown","spdWorstDown"];
  var rfKeys   = ["n24","n24strong","ch24","ch24busy","n5","ch5","dfs","interference"];
  var jm = count(b, jobKeys), bm = count(e, baseKeys), rm = count(e, rfKeys);
  if(filled(J.meta.client)) { jm.d++; } jm.t++;
  if(filled(J.meta.site))   { jm.d++; } jm.t++;

  var apsDone    = J.aps.filter(function(a){ return filled(a.location); }).length;
  var ptsDone    = J.points.filter(function(p){ return filled(p.rssi24) || filled(p.rssi5); }).length;
  var devDone    = J.devices.filter(function(d){ return filled(d.rssi); }).length;
  var ticksDone  = PHOTO_LIST.filter(function(t){ return J.ticks[t]; }).length;

  per[0] = ratio(jm.d, jm.t);
  per[1] = ratio(bm.d, bm.t);
  per[2] = ratio(rm.d, rm.t);
  per[3] = ratio(apsDone, 3);
  per[4] = ratio(ptsDone, 6);
  per[5] = ratio(devDone, 2);
  per[6] = ratio(ticksDone + Math.min(4, J.shots.length), PHOTO_LIST.length);
  per[7] = per[4];
  per[8] = per[4];

  var done  = jm.d + bm.d + rm.d + Math.min(3,apsDone) + Math.min(6,ptsDone) + Math.min(2,devDone) + Math.min(PHOTO_LIST.length, ticksDone);
  var total = jm.t + bm.t + rm.t + 3 + 6 + 2 + PHOTO_LIST.length;
  return {pct: Math.round(done/total*100), per: per};
}
function updateProgress(){
  var pr = progress();
  var bar = $("progbar");
  if(bar){ bar.style.width = pr.pct + "%"; bar.setAttribute("aria-valuenow", pr.pct); }
  var nav = $("nav");
  if(!nav) return;
  Array.prototype.forEach.call(nav.children, function(btn, i){
    var dot = btn.querySelector(".dot");
    if(!dot) return;
    var v = pr.per[i] || 0;
    dot.className = "dot" + (v >= 0.999 ? " full" : (v > 0 ? " part" : ""));
  });
}

/* ============================================================
   12. Job switcher
   ============================================================ */
function openSheet(build){
  var s = $("sheet");
  s.textContent = "";
  app(s, build());
  s.classList.add("on"); $("scrim").classList.add("on");
}
function closeSheet(){ $("sheet").classList.remove("on"); $("scrim").classList.remove("on"); }
$("scrim").addEventListener("click", closeSheet);

function jobsSheet(){
  var frag = document.createDocumentFragment();
  app(frag, [
    h("h3",{id:"sheetTitle"},"Surveys on this phone"),
    h("p",{class:"sub"},"Each survey is stored separately. Everything stays on the device.")
  ]);
  var list = h("div",{class:"joblist"});
  Object.keys(DB.jobs).sort(function(a,b){
    return (DB.jobs[b].updatedAt||DB.jobs[b].createdAt||"").localeCompare(DB.jobs[a].updatedAt||DB.jobs[a].createdAt||"");
  }).forEach(function(id){
    var j = DB.jobs[id];
    var on = id === DB.activeJob;
    var pts = (j.points||[]).filter(function(p){ return filled(p.rssi24)||filled(p.rssi5); }).length;
    var row = h("div",{class:"jobrow"+(on?" on":"")},
      h("button",{class:"jt", type:"button", onclick:function(){
        DB.activeJob = id; J = DB.jobs[id]; tab = 0; saveNow(); closeSheet(); render(); window.scrollTo(0,0);
      }},
        h("b",{}, j.meta.client || j.meta.site || "Untitled survey"),
        h("span",{}, (j.meta.date||"") + " · " + pts + " points" + (on ? " · open" : ""))),
      Object.keys(DB.jobs).length > 1 ? h("button",{class:"mini", type:"button", onclick:function(){
        var copy = DB.jobs[id];
        delete DB.jobs[id];
        if(DB.activeJob===id){ DB.activeJob = Object.keys(DB.jobs)[0]; J = DB.jobs[DB.activeJob]; }
        saveNow(); closeSheet(); render();
        toast("Survey removed","Undo", function(){ DB.jobs[copy.id]=copy; DB.activeJob=copy.id; J=copy; saveNow(); render(); });
      }},"Delete") : null
    );
    list.appendChild(row);
  });
  app(frag, list);
  app(frag, h("div",{class:"btnrow", style:"padding-bottom:14px"},
    h("button",{class:"pri", type:"button", onclick:function(){
      var name = prompt("Client name for the new survey","");
      if(name===null) return;
      var j = blankJob(name.trim());
      j.meta.surveyor = J.meta.surveyor || "";
      DB.jobs[j.id] = j; DB.activeJob = j.id; J = j; tab = 0;
      saveNow(); closeSheet(); render(); window.scrollTo(0,0);
    }},"New survey"),
    h("button",{type:"button", onclick:closeSheet},"Close")));
  return frag;
}

/* ============================================================
   13. Render
   ============================================================ */
var SECTIONS = [secJob, secBase, secRF, secAPs, secPoints, secDevices, secPhotos, secFindings, secReport];

function renderHeader(){
  var m = J.meta;
  var el = $("clientline");
  el.textContent = "";
  app(el, [ h("b",{}, m.client || "Untitled survey"), m.site ? " · " + m.site : "" ]);
  $("jobpill").textContent = m.ref || "Site survey";
}

function renderNav(){
  var nav = $("nav");
  nav.textContent = "";
  TABS.forEach(function(t,i){
    var btn = h("button",{class: i===tab ? "on" : "", type:"button", role:"tab",
                          "aria-selected": i===tab ? "true":"false"}, t.label);
    btn.appendChild(h("span",{class:"dot"}));
    btn.addEventListener("click", function(){ go(i); });
    nav.appendChild(btn);
  });
}

function render(){
  renderNav();
  renderHeader();
  var main = $("main");
  main.textContent = "";
  main.appendChild(SECTIONS[tab]());
  $("nextBtn").textContent = (tab === TABS.length-1) ? "Back to start" : "Next: " + TABS[tab+1].label;
  updateProgress();
  var on = $("nav").children[tab];
  if(on && on.scrollIntoView) on.scrollIntoView({inline:"center", block:"nearest"});
}
function go(i){
  tab = ((i % TABS.length) + TABS.length) % TABS.length;
  render();
  window.scrollTo(0,0);
}
$("nextBtn").addEventListener("click", function(){ go(tab+1); });
$("prevBtn").addEventListener("click", function(){ go(tab-1); });
$("jobsBtn").addEventListener("click", function(){ openSheet(jobsSheet); });
$("clientline").addEventListener("click", function(){ go(0); });

/* ---------- theme ---------- */
(function(){
  var stored = null;
  try { stored = localStorage.getItem("hh_theme"); } catch(e){}
  if(stored) document.documentElement.setAttribute("data-theme", stored);
  $("themeBtn").addEventListener("click", function(){
    var cur = document.documentElement.getAttribute("data-theme");
    var isDark = cur ? cur==="dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    var next = isDark ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("hh_theme", next); } catch(e){}
    document.querySelector('meta[name="theme-color"]').setAttribute("content", next==="dark" ? "#0B111F" : "#16203A");
  });
})();

/* ---------- keep the screen awake while surveying ---------- */
(function(){
  var lock = null;
  function req(){
    if(!navigator.wakeLock || document.visibilityState !== "visible") return;
    navigator.wakeLock.request("screen").then(function(l){ lock = l; }).catch(function(){});
  }
  req();
  document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "visible") req(); });
})();

/* ---------- offline ---------- */
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}

/* ---------- boot ---------- */
loadDB();
render();
setSaved("Ready");
</script>
